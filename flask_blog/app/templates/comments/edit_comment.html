{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="bg-white border rounded p-4 p-md-5">
      <h1 class="h4 fw-bold mb-3">Edit Comment</h1>
      <form method="post" novalidate>
        {{ form.hidden_tag() }}
        <div class="mb-3">
          {{ form.body(class="form-control" + (" is-invalid" if form.body.errors else ""), rows=4) }}
          {% for error in form.body.errors %}
            <div class="invalid-feedback">{{ error }}</div>
          {% endfor %}
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-editorial btn-sm px-4">Save Changes</button>
          <a href="{{ url_for('posts.post_detail', post_id=comment.post_id) }}#comments" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
